[package]
name = "web_push_server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.11"
actix-cors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
web-push = "0.11"
uuid = { version = "1.17", features = ["v4", "serde"] }
tokio = { version = "1.45", features = ["full"] }
ct-codecs = "1.1.6"